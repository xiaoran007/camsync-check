; Build inside the container; record resolved packages at first approved build.
[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra@1.9.0
board = uno_r4_wifi
framework = arduino
platform_packages = platformio/framework-arduinorenesas-uno@1.6.0
monitor_speed = 115200
extra_scripts = pre:generate_protocol.py
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17
