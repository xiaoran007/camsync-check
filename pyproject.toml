[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camsync-check"
version = "0.1.0"
description = "Optical timing analysis for multi-camera synchronization checks"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<5",
    "tqdm>=4.66,<5",
]

[project.scripts]
camsync-check = "camsync_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camsync_check = ["profiles/*.json"]
